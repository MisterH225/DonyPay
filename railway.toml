# DonyPay backend — déploiement Railway
# Projet: 90de654d-6836-45a1-b750-c61b52aa29b3
#
# Dans le dashboard Railway :
# - Root Directory: `/` (racine du monorepo)
# - Builder: Dockerfile (ce fichier)
# - Ne PAS définir PORT manuellement (Railway l’injecte)
# - DATABASE_URL = ${{Postgres.DATABASE_URL}} (service Postgres du même projet)

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = [
  "backend/**",
  "admin/package.json",
  "mobile/package.json",
  "package.json",
  "package-lock.json",
  "railway.toml",
]

[deploy]
# startCommand omis → utilise le CMD du Dockerfile (migrate + node)
# preDeployCommand : migrate une fois avant bascule trafic (idempotent avec le start)
preDeployCommand = ["sh", "/app/backend/scripts/railway-prisma.sh", "migrate", "deploy"]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
