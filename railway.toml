# DonyPay backend — déploiement Railway
# Projet: 90de654d-6836-45a1-b750-c61b52aa29b3
#
# Dans le dashboard Railway :
# - Root Directory: `/` (racine du monorepo)
# - Builder: Dockerfile (ce fichier)

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = [
  "backend/**",
  "admin/package.json",
  "mobile/package.json",
  "package.json",
  "package-lock.json",
  "railway.toml",
]

[deploy]
# startCommand omis → utilise le CMD du Dockerfile (migrate + node)
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
