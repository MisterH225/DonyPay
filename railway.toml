# DonyPay backend — déploiement Railway
# Projet: 90de654d-6836-45a1-b750-c61b52aa29b3
#
# Dans le dashboard Railway :
# - Root Directory: `/` (racine du monorepo)
# - Builder: Dockerfile (ce fichier)
# - Ne PAS définir PORT manuellement (Railway l’injecte)
# - DATABASE_URL = ${{Postgres.DATABASE_URL}} (service Postgres du même projet)

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
# Patterns larges : un push main qui ne touche que le workflow ne doit pas
# empêcher un redeploy si le Dockerfile / scripts changent.
watchPatterns = [
  "backend/**",
  "admin/package.json",
  "mobile/package.json",
  "package.json",
  "package-lock.json",
  "railway.toml",
  "nixpacks.toml",
]

[deploy]
# startCommand omis → utilise le CMD du Dockerfile (railway-start.sh : wait DB + migrate + nest)
# Pas de preDeployCommand : migrate est déjà dans railway-start.sh, et un preDeploy
# qui tourne avec DATABASE_URL vide fait échouer le deploy avant les logs utiles.
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
