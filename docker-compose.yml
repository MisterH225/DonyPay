services:
  postgres:
    image: postgres:17-alpine
    container_name: donypay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: donypay
      POSTGRES_PASSWORD: donypay
      POSTGRES_DB: donypay
    volumes:
      - donypay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donypay -d donypay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donypay_pg_data:
